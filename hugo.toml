title = 'Dr Steve Jasper'
baseURL = 'https://drstevejasper.com/'
languageCode = 'en-au'
theme = ["github.com/theNewDynamic/gohugo-theme-ananke"]

DefaultContentLanguage = "en"
contentDir = "content/en"
SectionPagesMenu = "main"
Paginate = 9
# googleAnalytics = ""
enableRobotsTXT = false
enableEmoji = true
cleanDestinationDir = true
copyright = "Dr Steve Jasper"
enableGitInfo = true

[languages]
[languages.en]
title = "Dr Steve Jasper"
weight = 1
contentDir = "content/en"

[permalinks]
[permalinks.page]
'blog' = '/:year/:month/:slug/'

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[params]
author = "Dr Steve Jasper"
favicon = ""
site_logo = ""
